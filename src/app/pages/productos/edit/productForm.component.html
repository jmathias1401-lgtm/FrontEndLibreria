<div class="modal-content mt-5">
    <div class="modal-header">
        <h3 class="modal-title">{{operacion}} Producto</h3>
        <button type="button" class="btn-close btn-close-white" (click)="cancel()" aria-label="Close"></button>
    </div>
    
    <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="create()">
            
            <!-- Main Info Section -->
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="name">Nombre del Producto</label>
                    <input id="name" class="form-control" formControlName="nombre" (input)="mayusculas('nombre')" type="text" placeholder="Ej: Plumón Indeleble...">
                    @if (form.get('nombre')?.invalid && form.get('nombre')?.touched) {
                        <small class="text-danger">
                            El nombre es obligatorio.
                        </small>
                    }
                </div>

                <div class="form-group">
                    <label for="codbarra">Código de Barras</label>
                    <input id="codbarra" type="text" class="form-control" formControlName="codbarra" placeholder="Escanee o escriba el código">
                </div>

                <div class="form-group">
                    <label for="codigoproducto">Código Interno</label>
                    <input id="codigoproducto" class="form-control" formControlName="codigoproducto" type="text" readonly>
                </div>

                <div class="form-group">
                    <label for="venci">Fecha de Vencimiento</label>
                    <input id="venci" class="form-control" formControlName="vencimiento" type="date">
                </div>
            </div>

            <!-- Single Row: Location, U.M, Pres, Lab -->
            <div class="grid-4">
                <div class="form-group">
                    <label for="ubic">Ubicación</label>
                    <input id="ubic" class="form-control" formControlName="ubicacion" (input)="mayusculas('ubicacion')" type="text" placeholder="Ej: Almacén A-1">
                </div>

                <div class="form-group">
                    <label for="unidadmedida">Unidad de Medida</label>
                    <select id="unidadmedida" class="form-select" formControlName="unidadmedida">
                        <option [ngValue]="null" disabled>Seleccione unidad</option>
                        @for (uni of unidadmedida; track uni.idunidadmedida) {
                            <option [ngValue]="uni">{{uni.nombreunidad}}</option>
                        }
                    </select>
                </div>

                <div class="form-group">
                    <label for="presentacion">Presentación</label>
                    <select id="presentacion" class="form-select" formControlName="presentacion">
                        <option [ngValue]="null" disabled>Seleccione presentación</option>
                        @for (prese of presentacion; track prese.idpresentacion) {
                            <option [ngValue]="prese">{{prese.nombrepresentacion}}</option>
                        }
                    </select>
                </div>

                <div class="form-group">
                    <label for="laboratorio">Marca</label>
                    <select id="laboratorio" class="form-select" formControlName="laboratorio">
                        <option [ngValue]="null" disabled>Seleccione marca</option>
                        @for (labo of laboratorio; track labo.idlaboratorio) {
                            <option [ngValue]="labo">{{labo.nombrelaboratorio}}</option>
                        }
                    </select>
                </div>
            </div>

            <!-- Composition -->
            <div class="form-group mb-4">
                <label for="compo">Composición / Descripción</label>
                <textarea id="compo" class="form-control" formControlName="composicion" rows="2"></textarea>
            </div>

            <!-- Image Section -->
            <div class="form-group mb-4">
                <label>Imagen del Producto</label>
                <div class="image-upload-container">
                    <input #imagenInput type="file" (change)="onFileSelected($event)" accept="image/*" class="form-control mb-2">
                    <p class="text-muted small">Formatos permitidos: JPG, PNG. Tamaño máx: 2MB</p>
                    
                    @if (imagePreview) {
                        <div class="preview-container">
                            <img [src]="imagePreview" class="preview-image" alt="Vista previa">
                            <p class="mt-2 small text-primary">{{form.get('imagen_path')?.value}}</p>
                        </div>
                    }
                </div>
            </div>

            <!-- Pricing & Stock Section -->
            <div class="stats-grid">
                <div class="form-group">
                    <label for="precioventa">P.Unidad</label>
                    <div class="input-group">
                        <span class="input-group-text">S/</span>
                        <input id="precioventa" class="form-control" formControlName="precioventa" type="number" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label for="precioblister">P. Docena</label>
                    <div class="input-group">
                        <span class="input-group-text">S/</span>
                        <input id="precioblister" class="form-control" formControlName="precioblister" type="number" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label for="preciocaja">P. Ciento</label>  
                    <div class="input-group">
                        <span class="input-group-text">S/</span>
                        <input id="preciocaja" class="form-control" formControlName="preciocaja" type="number" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input id="stock" class="form-control" formControlName="stock" type="number">
                </div>
            </div>

            <!-- Actions -->
            <div class="btn-actions">
                <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
                    Cancelar
                </button>
                <button [disabled]="form.invalid" type="submit" class="btn btn-primary">
                    {{operacionBoton}} Producto
                </button>
            </div>

        </form>
    </div>
</div>
